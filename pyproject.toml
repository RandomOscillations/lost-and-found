[project]
name = "lostfound-vision"
version = "0.1.0"
description = "Lost & Found Vision gateway MVP"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.0.1",
    "aiosqlite>=0.19",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "pgvector>=0.2.5",
    "httpx>=0.27",
    "nats-py>=2.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lostfound*", "packages*", "services*"]
