<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lost &amp; Found Vision – MVP UI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="bg-light">
    <main class="container py-4">
      <header class="mb-4">
        <h1 class="h2">Lost &amp; Found Vision</h1>
        <p class="text-muted mb-0">Manual test harness for the gateway MVP.</p>
      </header>

      <section class="mb-4">
        <form class="row g-2 align-items-center" id="api-config-form">
          <div class="col-md-4 col-12">
            <label class="form-label" for="apiBase">Gateway URL</label>
            <input
              type="url"
              class="form-control"
              id="apiBase"
              value="http://127.0.0.1:8000"
              required
            />
          </div>
          <div class="col-auto mt-4">
            <button class="btn btn-outline-primary" type="submit">Ping /healthz</button>
          </div>
          <div class="col" id="health-status"></div>
        </form>
      </section>

      <div id="global-alert" class="alert d-none" role="alert"></div>

      <div class="row g-4">
        <div class="col-lg-6">
          <section class="card shadow-sm">
            <div class="card-header">Auth</div>
            <div class="card-body">
              <form id="signup-form" class="row g-2">
                <h2 class="h5">Sign up</h2>
                <div class="col-12">
                  <label class="form-label" for="signupEmail">Email</label>
                  <input type="email" class="form-control" id="signupEmail" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="signupPassword">Password</label>
                  <input type="password" class="form-control" id="signupPassword" minlength="8" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="signupDisplayName">Display name</label>
                  <input type="text" class="form-control" id="signupDisplayName" required />
                </div>
                <div class="col-12">
                  <button class="btn btn-primary" type="submit">Create account</button>
                </div>
                <div class="col-12">
                  <div class="small text-muted" id="signup-result"></div>
                </div>
              </form>

              <hr class="my-4" />

              <form id="login-form" class="row g-2">
                <h2 class="h5">Log in</h2>
                <div class="col-md-6">
                  <label class="form-label" for="loginEmail">Email</label>
                  <input type="email" class="form-control" id="loginEmail" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="loginPassword">Password</label>
                  <input type="password" class="form-control" id="loginPassword" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="loginRole">Session slot</label>
                  <select id="loginRole" class="form-select">
                    <option value="owner" selected>Owner session</option>
                    <option value="finder">Finder session</option>
                  </select>
                </div>
                <div class="col-12">
                  <button class="btn btn-success" type="submit">Log in &amp; store token</button>
                </div>
                <div class="col-12">
                  <div class="small" id="login-status"></div>
                </div>
              </form>

              <div class="mt-3">
                <h3 class="h6">Active sessions</h3>
                <ul class="list-group small" id="session-list"></ul>
              </div>
            </div>
          </section>
        </div>

        <div class="col-lg-6">
          <section class="card shadow-sm mb-4">
            <div class="card-header">Finder workflow</div>
            <div class="card-body">
              <form id="found-form" class="row g-2">
                <div class="col-12">
                  <label class="form-label" for="foundTitle">Title</label>
                  <input type="text" class="form-control" id="foundTitle" value="Blue Hydro Flask" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="foundDescription">Description</label>
                  <textarea class="form-control" id="foundDescription" rows="2" required>Found a blue Hydro Flask near the library.</textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="foundZone">Zone</label>
                  <input type="text" class="form-control" id="foundZone" value="Library" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="foundWhen">When (UTC)</label>
                  <input type="datetime-local" class="form-control" id="foundWhen" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="foundTags">Tags (comma separated)</label>
                  <input type="text" class="form-control" id="foundTags" value="hydroflask, blue" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="foundCategory">Category</label>
                  <input type="text" class="form-control" id="foundCategory" value="water_bottle" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="foundPhoto">Photo URL</label>
                  <input type="url" class="form-control" id="foundPhoto" value="http://minio:9000/lfs-media/example.jpg" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="foundPrompts">Custom prompts (max 2, separated by newline)</label>
                  <textarea class="form-control" id="foundPrompts" rows="2">What sticker is on the lid?</textarea>
                </div>
                <div class="col-12">
                  <button class="btn btn-primary" type="submit">Post found item</button>
                </div>
              </form>
              <div class="mt-3 small" id="found-output"></div>
            </div>
          </section>

          <section class="card shadow-sm">
            <div class="card-header">Owner workflow</div>
            <div class="card-body">
              <form id="lost-form" class="row g-2">
                <div class="col-12">
                  <label class="form-label" for="lostTitle">Title</label>
                  <input type="text" class="form-control" id="lostTitle" value="My Blue Hydro Flask" required />
                </div>
                <div class="col-12">
                  <label class="form-label" for="lostDescription">Description</label>
                  <textarea class="form-control" id="lostDescription" rows="2" required>Blue bottle with a wolf sticker on the lid.</textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lostZone">Zone</label>
                  <input type="text" class="form-control" id="lostZone" value="Library" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lostWhen">When (UTC)</label>
                  <input type="datetime-local" class="form-control" id="lostWhen" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lostTags">Tags</label>
                  <input type="text" class="form-control" id="lostTags" value="hydroflask, blue" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="lostCategory">Category</label>
                  <input type="text" class="form-control" id="lostCategory" value="water_bottle" />
                </div>
                <div class="col-12">
                  <button class="btn btn-primary" type="submit">Post lost item</button>
                </div>
              </form>
              <div class="mt-3 small" id="lost-output"></div>

              <hr class="my-4" />

              <div class="d-grid gap-2 mb-3">
                <button class="btn btn-outline-secondary" id="matches-btn">Fetch matches for last lost item</button>
              </div>
              <div class="small" id="matches-output"></div>

              <form id="claim-form" class="row g-2 mt-3">
                <h3 class="h6">Open claim (owner)</h3>
                <div class="col-md-6">
                  <label class="form-label" for="claimItemId">Lost item ID</label>
                  <input type="text" class="form-control" id="claimItemId" />
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="claimCandidateId">Candidate ID</label>
                  <input type="text" class="form-control" id="claimCandidateId" />
                </div>
                <div class="col-12">
                  <label class="form-label" for="claimAnswers">Answers (JSON array)</label>
                  <textarea class="form-control" id="claimAnswers" rows="3">[
  {"question": "Describe any stickers or markings on the bottle.", "answer": "Wolf sticker"},
  {"question": "What size or capacity is the bottle?", "answer": "21 oz"}
]</textarea>
                </div>
                <div class="col-12">
                  <button class="btn btn-outline-primary" type="submit">Open claim</button>
                </div>
              </form>
              <div class="mt-3 small" id="claim-output"></div>

              <div class="d-grid gap-2 mt-3">
                <button class="btn btn-outline-success" id="verify-btn">Finder verify last claim</button>
              </div>
              <div class="small" id="verify-output"></div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
