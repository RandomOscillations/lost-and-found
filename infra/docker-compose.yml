services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lostfound
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10
    restart: unless-stopped
    ports:
      - "4222:4222"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.auth
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lostfound
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_PUBLIC_KEY_PATH: /keys/jwt.pub
    ports:
      - "8001:8001"
    volumes:
      - ../infra/keys:/keys:ro

  intake:
    build:
      context: ..
      dockerfile: docker/Dockerfile.intake
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lostfound
      AUTH_SERVICE_URL: http://auth:8001
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_PUBLIC_KEY_PATH: /keys/jwt.pub
    ports:
      - "8002:8002"
    volumes:
      - ../infra/keys:/keys:ro

  vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vision
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lostfound
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_PUBLIC_KEY_PATH: /keys/jwt.pub
    ports:
      - "8003:8003"
    volumes:
      - ../infra/keys:/keys:ro

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - auth
      - intake
      - vision
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lostfound
      AUTH_SERVICE_URL: http://auth:8001
      INTAKE_SERVICE_URL: http://intake:8002
      VISION_SERVICE_URL: http://vision:8003
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_PUBLIC_KEY_PATH: /keys/jwt.pub
    ports:
      - "8000:8000"
    volumes:
      - ../infra/keys:/keys:ro

volumes:
  pgdata: {}
  minio: {}
